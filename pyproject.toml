[project]
name = "aoc"
version = "0.1.0"
description = "Python boilerplate project for Advent of Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PERF", "RUF", "PT", "N"]

[tool.mypy]
strict = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
